name: Refresh price data

on:
  schedule:
    - cron: "17 3,15 * * *" # twice daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/config.json]

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch award availability (seats.aero)
        env:
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
        run: node scripts/fetch_awards.mjs

      - name: Fetch deal headlines (RSS)
        if: always()
        run: node scripts/fetch_deals.mjs

      - name: Record price history
        if: always()
        run: node scripts/append_history.mjs

      - name: Send alerts
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/send_alerts.mjs

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh price data [skip ci]"
            git push
          fi
