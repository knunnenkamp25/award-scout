name: Refresh cash benchmarks

# Cash benchmarks move slowly and only feed the cents-per-mile math, so a
# monthly refresh (cash_origins × destinations calls) stays inside
# SerpAPI's free plan (100 searches/mo) with room for manual runs.
on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch cash prices (SerpAPI / Google Flights)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/fetch_cash.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh cash benchmarks [skip ci]"
            git push
          fi
